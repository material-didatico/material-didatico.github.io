
site_name: Material Didático
site_url: https://material-didatico.github.io

nav:
  - Início: index.md
  - Graduação:
    - Matemática Básica:                       pages/mat_basica/index.md
    - Cálculo de Funções de Várias Vaiáveis I: pages/cfvv1/index.md
    - Integração e Séries:                     pages/is/index.md
    - EDPs:                                    pages/edp/index.md
    - Administração:                           pages/administracao/index.md
    - Cálculo IV:                              pages/calculo_4/index.md
  - Ensino Básico:
    - Infinito:          pages/infinito/index.md
    - Construção Civil:  pages/civil/index.md
    - Métodos Numéricos: pages/met_num_medio/index.md
    - Investimentos:     pages/investimentos/index.md
    - Zip Math:          pages/zip_math/index.md
  - Profmat:
    - Nice Booklet: pages/booklet/index.md
    - CorretorENA:  https://luis-dafonseca.github.io/CorretorENA
    - Curadoria:    https://mathtech-cefet-mg.github.io/Curadoria_Profmat

  - Outros:
    - LaTeX:  pages/latex/latex.md
    - Python: pages/python/index.md
  - Tutoriais:
    - Git e GitHub: pages/tutoriais/github.md
    - Markdown:     pages/tutoriais/markdown.md

theme:
  name:       material
  language:   pt-BR
  logo:       imag/favicon.png
  favicon:    imag/favicon.png
  custom_dir: docs/overrides

  features:
    - navigation.instant

  font:
    text: "Lato"
    code: "Fira Code"

  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true # Enables dollar delimiters for inline math

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML

extra_css:
  - stylesheets/extras.css

extra:
  analytics:
    provider: google
    property: G-QCK5NC3EEP
